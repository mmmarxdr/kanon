server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend.
    # ^~ prevents the static-asset regex below from hijacking /api/ paths
    # that happen to end in an asset extension (regex beats prefix otherwise).
    location ^~ /api/ {
        proxy_pass http://kanon-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-friendly: the API serves text/event-stream on /api/events/*.
        # Disable response buffering and keep the upstream connection long-lived
        # so events flush to the client immediately (API heartbeat is 30s).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Health check endpoint proxy
    location /health {
        proxy_pass http://kanon-api:3000;
    }

    # index.html must always revalidate: without Cache-Control, browsers apply
    # heuristic caching and keep serving a stale index pointing at old hashed
    # bundles after every deploy. ETag makes revalidation a cheap 304.
    # SPA fallbacks rewrite here internally, so deep links get the header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets are content-addressed — cache forever.
    # Single Cache-Control header (expires + add_header would emit two).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
