services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanon
      POSTGRES_PASSWORD: kanon
      POSTGRES_DB: kanon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanon"]
      interval: 5s
      timeout: 5s
      retries: 5

  kanon-api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://kanon:kanon@postgres:5432/kanon?schema=public"
      # The prod image strips devDeps (no pino-pretty), so NODE_ENV must stay
      # "production". That triggers env validation requiring 32+ char,
      # non-default secrets below. Secure cookies work over http://localhost
      # because browsers treat localhost as a secure context.
      JWT_SECRET: "${JWT_SECRET:-dev-local-jwt-secret-0123456789abcdefghij}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-dev-local-jwt-refresh-secret-0123456789abcdefghij}"
      COOKIE_SECRET: "${COOKIE_SECRET:-dev-local-cookie-secret-0123456789abcdefghij}"
      METRICS_TOKEN: "${METRICS_TOKEN:-dev-local-metrics-token}"
      REDMINE_ENDPOINT_ALLOWLIST:
      PORT: "${KANON_API_PORT:-3000}"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      CORS_ORIGIN: "http://localhost:${KANON_WEB_PORT:-5173}"
    ports:
      - "${KANON_API_PORT:-3000}:${KANON_API_PORT:-3000}"
    command: >
      sh -c "prisma generate --schema=prisma/schema.prisma && prisma migrate deploy --schema=prisma/schema.prisma && node dist/index.js"

  kanon-web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      - kanon-api
    environment:
      NODE_ENV: "development"
      API_URL: "http://kanon-api:3000"
    ports:
      - "${KANON_WEB_PORT:-5173}:${KANON_WEB_PORT:-5173}"

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - test
    environment:
      POSTGRES_USER: kanon
      POSTGRES_PASSWORD: kanon
      POSTGRES_DB: kanon_e2e
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata_test:
