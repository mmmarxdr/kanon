services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-kanon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kanon-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kanon-api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      POSTGRES_OWNER_DATABASE_URL: ${POSTGRES_OWNER_DATABASE_URL:?Set POSTGRES_OWNER_DATABASE_URL in .env.production}
      PRIVACY_OPERATOR_DATABASE_URL: ${PRIVACY_OPERATOR_DATABASE_URL:?Set PRIVACY_OPERATOR_DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env.production}
      BASE_URL: ${BASE_URL:?Set BASE_URL in .env.production}
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      REDMINE_ENDPOINT_ALLOWLIST: ${REDMINE_ENDPOINT_ALLOWLIST:-}
      INTEGRATION_COMMENT_CAPTURE_ENABLED: ${INTEGRATION_COMMENT_CAPTURE_ENABLED:-false}
      INTEGRATION_COMMENT_DISPATCH_ENABLED: ${INTEGRATION_COMMENT_DISPATCH_ENABLED:-false}
      TRIAGE_SEARCH_ENABLED: ${TRIAGE_SEARCH_ENABLED:-false}
      TRIAGE_PREVIEW_ENABLED: ${TRIAGE_PREVIEW_ENABLED:-false}
      TRIAGE_PROPOSAL_READS_ENABLED: ${TRIAGE_PROPOSAL_READS_ENABLED:-false}
      TRIAGE_PROPOSALS_ENABLED: ${TRIAGE_PROPOSALS_ENABLED:-false}
      TRIAGE_DISMISS_ENABLED: ${TRIAGE_DISMISS_ENABLED:-false}
      TRIAGE_RETENTION_ENABLED: ${TRIAGE_RETENTION_ENABLED:-false}
      SETUP_TOKEN_TTL_DAYS: ${SETUP_TOKEN_TTL_DAYS:-7}
      ONBOARDING_TOKEN_TTL_HOURS: ${ONBOARDING_TOKEN_TTL_HOURS:-72}
    networks:
      - kanon-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kanon-web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.production
    restart: unless-stopped
    depends_on:
      kanon-api:
        condition: service_healthy
    ports:
      - "${KANON_WEB_PORT:-80}:80"
    networks:
      - kanon-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  kanon-internal:
    driver: bridge

volumes:
  pgdata:
