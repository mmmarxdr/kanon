# Build and publish official Kanon container images to GHCR.
#
# Generic / product-level: anyone self-hosting can pull these prebuilt images
# instead of building locally (see deploy/dev/docker-compose.images.yml).
#
# Multi-arch (amd64 + arm64): each arch builds on its native GitHub runner —
# no QEMU, so both builds run at full speed. Builds push by digest only; the
# merge job stitches the per-arch digests into a single multi-arch manifest
# per image, so `latest` and the sha tag work on both architectures.
#
# Optional CD hook: if the DEPLOY_WEBHOOK_URL repo secret is set, the final
# job POSTs to it after the manifests are published (e.g. a Dokploy/other
# deploy webhook). With the secret unset the job is a no-op, so forks and
# plain self-hosters are unaffected.

name: Publish images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: packages/api/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
          - name: api
            dockerfile: packages/api/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: web
            dockerfile: packages/web/Dockerfile.production
            arch: amd64
            runner: ubuntu-24.04
          - name: web
            dockerfile: packages/web/Dockerfile.production
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/kanon-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check source SHA against current main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The triggering CI run ID was missing or malformed; stopping safely." >&2
            exit 1
          fi

          if ! latest_id="$(
            gh api --method GET --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&status=completed&per_page=100" 2>/dev/null |
            jq -s '[.[].workflow_runs[]
              | select(.event == "push" and .head_branch == "main" and .conclusion == "success")
              | {id, created_at}]
              | sort_by([.created_at, .id])
              | last
              | (.id // empty)'
          )"; then
            echo "Could not read successful CI runs; stopping safely." >&2
            exit 1
          fi
          if [[ ! "$latest_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "The newest successful CI run ID was missing or malformed; stopping safely." >&2
            exit 1
          fi

          if [[ "$TRIGGER_RUN_ID" == "$latest_id" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer successful CI run exists; skipping publication."
          fi

  merge:
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    needs: [build, guard]
    strategy:
      fail-fast: false
      matrix:
        name: [api, web]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kanon-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ env.SOURCE_SHA }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/kanon-${{ matrix.name }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/kanon-${{ matrix.name }}:${{ steps.meta.outputs.version }}

  deploy-hook:
    runs-on: ubuntu-24.04
    needs: merge
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Trigger deploy webhook (no-op when secret unset)
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
